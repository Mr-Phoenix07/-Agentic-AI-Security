# Example AEGIS engagement config.
# IMPORTANT: every target here is either the offline mock or a self-owned local
# lab. Only add real endpoints/models you own or are explicitly authorized to
# assess — the authorization scope below is fail-closed and enforced at runtime.

engagement: "acme-ai-platform-q3"
workdir: "./aegis_runs"
log_level: "INFO"

authorization:
  dry_run: false
  rules:
    - label: "acme-authorized-lab"
      hosts: ["localhost", "127.0.0.1", "api.internal.acme.test"]
      url_globs: ["mock://*", "http://localhost*"]
      model_ids: ["mock-*", "local/*"]
      authorization_ref: "SoW-2026-ACME-014 (signed)"
      max_requests: 100000

loop:
  max_rounds: 4
  probes_per_round: 18
  min_rounds: 2
  coverage_target: 0.85
  confidence_target: 0.75
  seed: 1337

targets:
  - id: "assistant-llm"
    kind: "local_llm"
    provider: "mock"
    model: "mock-secure-1"
    mode: "grey_box"
    params: { quality: 0.82 }

  - id: "kb-rag"
    kind: "rag"
    provider: "mock"
    model: "mock-secure-1"
    mode: "grey_box"
    metadata:
      top_k: 3
      corpus:
        - { id: "D1", text: "TLS uses a chain of trust rooted in certificate authorities to validate server identity.", source: "kb/tls" }
        - { id: "D2", text: "The principle of least privilege grants the minimum access required for a task.", source: "kb/authz" }
        - { id: "D3", text: "Parameterized queries prevent SQL injection by separating code from data.", source: "kb/appsec" }

  - id: "public-api"
    kind: "rest_api"
    provider: "mock"
    mode: "grey_box"
    metadata:
      endpoints:
        - { path: "/v1/chat", method: "POST", auth_required: false, is_ai_endpoint: true, rate_limited: false }
        - { path: "/v1/admin/reindex", method: "POST", auth_required: false, rate_limited: true }
        - { path: "/v1/health", method: "GET", auth_required: false, rate_limited: true }

  - id: "tools-mcp"
    kind: "mcp"
    provider: "mock"
    mode: "grey_box"
    metadata:
      transport: "http"
      authenticated: false
      resources: ["file://notes", "db://readonly"]
      tools:
        - { name: "search_docs", description: "read-only search", dangerous: false }
        - { name: "send_email", description: "sends email", dangerous: true, requires_confirmation: false }
        - { name: "delete_record", description: "deletes a DB row", dangerous: true, requires_confirmation: true }
